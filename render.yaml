services:
  # ── Backend + Frontend: Single Docker service ─────────────────────────────
  # FastAPI serves both the API AND the built React frontend.
  # Uses requirements-deploy.txt (no PyTorch) → fits in Render free 512MB RAM.
  - type: web
    name: fashionverse
    runtime: docker
    dockerfilePath: ./Dockerfile    # at repo root
    plan: free
    envVars:
      - key: LLM_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: PORT
        value: 7860
